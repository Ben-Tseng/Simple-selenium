<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 420px;
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #1d1d1f;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .desc {
      color: #555;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    #rulesList {
      max-height: 320px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
    }
    .rule-item {
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .rule-item:last-child {
      margin-bottom: 0;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .text-input, .script-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 7px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .script-input {
      min-height: 70px;
      resize: vertical;
      font-family: Menlo, Monaco, Consolas, monospace;
    }
    .rule-actions {
      display: flex;
      justify-content: flex-end;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      border: 0;
      border-radius: 6px;
      padding: 9px;
      cursor: pointer;
      color: #fff;
      background: #1463ff;
      font-size: 13px;
    }
    button.delete-btn {
      flex: 0 0 auto;
      border: 1px solid #e05a5a;
      border-radius: 6px;
      background: #fff;
      color: #e05a5a;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #status {
      margin-top: 8px;
      color: #333;
      line-height: 1.4;
      word-break: break-word;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>Tab Rule Runner</h1>
  <div class="desc">每条规则：命中 Keyword 后执行对应 Script。</div>
  <div id="rulesList"></div>
  <div class="row">
    <button id="addBtn">新增规则</button>
  </div>
  <div class="row">
    <button id="saveBtn">保存规则</button>
    <button id="startBtn">开始扫描全部Tab</button>
  </div>
  <div id="status">加载中...</div>
  <script src="popup.js"></script>
</body>
</html>
